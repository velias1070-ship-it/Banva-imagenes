suite: full-coverage
description: |
  Un caso por categoría activa en src/lib/category-strategy.ts. Smoke test
  amplio para detectar regresiones que solo aparecen en una categoría.
  Cuando salga un modelo nuevo, esta suite + critical-cases dan cobertura
  razonable antes de adoptar.
version: 1
default_min_score: 0.65

cases:
  - id: quilts-default
    discovery_filter:
      category: quilts
      status_in: [approved]
    expected_min_score: 0.70

  - id: sabanas-default
