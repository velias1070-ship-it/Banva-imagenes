suite: critical-cases
description: |
  Production-validated failure patterns. Each case_signature resolves to
  ≥ 3 terminal jobs with usable hero+swatch in generation_jobs as of
  2026-04-29. Re-populated from scripts/discover-case-signatures.ts output;
  v1 used wildcard patterns ("%multipattern%") that lost matches against
  the resolveSuite .limit(50) PostgREST cap when high-volume categories
  saturated the page before the post-fetch category filter ran.

  Each case below uses an exact case_signature, so the category prefix
  in the signature is the implicit scope — no post-fetch filter needed.
version: 2
default_min_score: 0.70

cases:
  - id: sabanas-multipattern-lifestyle
    description: |
      Sábanas con fundas + bajera de patrones distintos en hero lifestyle.
      Pro single-pass sin crop. Tela plana obligatoria.
      (76 jobs prod: 58 approved, 1 flagged, 17 error)
      (memoria: feedback_sabanas_multipattern)
    discovery_filter:
      case_signature: "sabanas:lifestyle:multipattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.75

  - id: quilts-multipattern-lifestyle
    description: |
      Quilt + fundas con patrones distintos en hero lifestyle. Multi-superficie
      con consistencia de stripes/patrones. Verificador miente sobre orientación.
      (122 jobs prod: 111 approved, 11 flagged)
      (memoria: feedback_multi_surface_stripe_consistency, feedback_stripe_orientation_rotation)
    discovery_filter:
      case_signature: "quilts:lifestyle:multipattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.70

  - id: quilts-multipattern-detail
    description: |
      Quilt detail shot con stitch pattern 3D embossed. Limitación conocida:
      textura difícil de reemplazar en cuerpo del quilt → Tier 2 directo.
      (71 jobs prod: 67 approved, 2 flagged, 2 error)
      (memoria: feedback_pattern_replacement, regla: prompts.md "Quilting 3D")
    discovery_filter:
      case_signature: "quilts:detail:multipattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.70

  - id: toallas-baseline
    description: |
      Toallas único bucket en prod (lifestyle:unknownpattern). Light-on-white
      challenge + swatches a menudo full-product-photo.
      (86 jobs prod: 73 approved, 13 flagged)
      (memoria: feedback_swatch_composition_leak)
    discovery_filter:
      case_signature: "toallas:lifestyle:unknownpattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.75

  - id: cortinas-multipattern-detail
    description: |
      Cortinas detail con patrones distintos hero/swatch. Reemplaza el v1
      cubrecama-pattern-replacement (categoría cubrecama no existe en prod).
      (10 jobs prod: 4 approved, 6 flagged)
    discovery_filter:
      case_signature: "cortinas:detail:multipattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.70

  - id: alfombras-multipattern-detail
    description: |
      Alfombras detail con patrones distintos. Categoría con histórico bajo
      approval (ver alfombras-debugging.yaml para A/B exhaustivo).
      (11 jobs prod: 4 approved, 7 flagged)
    discovery_filter:
      case_signature: "alfombras:detail:multipattern:light"
      status_in: [approved, flagged]
    expected_min_score: 0.50

  - id: plumones-dark-swatch
    description: |
      Plumones lifestyle con swatch dark. Reemplaza v1 toalla-blanco-claro
      (no existe variante :dark de toallas en prod). Dark swatch handling
      via prompt-only (isSwatchDark + nota DARK FABRIC HANDLING).
      (19 jobs prod: 17 approved, 2 flagged)
      (regla: prompts.md "Dark Swatch Handling")
    discovery_filter:
      case_signature: "plumones:lifestyle:unknownpattern:dark"
      status_in: [approved, flagged]
    expected_min_score: 0.70
